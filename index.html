<html lang="pl">
<head>

    <script src="https://unpkg.com/globe.gl"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
            transition: opacity 0.8s ease;
        }

        /* --- ANIMACJA ZEGARA COFAJĄCEGO SIĘ W CZASIE --- */
        #time-rewind-overlay {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 75%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            opacity: 1;
            transition: opacity 0.65s ease, visibility 0.65s ease;
        }
        #time-rewind-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .clock-dial {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid rgba(251, 191, 36, 0.7);
            box-shadow: 0 0 35px rgba(251, 191, 36, 0.2), inset 0 0 25px rgba(2, 6, 23, 0.9);
            background: rgba(15, 23, 42, 0.9);
        }
        .clock-tick {
            position: absolute;
            top: 6px;
            left: 50%;
            width: 2px;
            height: 10px;
            background: rgba(251, 191, 36, 0.45);
            transform-origin: 50% 69px;
        }
        .clock-hand-minute {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 3px;
            height: 54px;
            margin-left: -1.5px;
            background: #fbbf24;
            border-radius: 999px;
            transform-origin: 50% 100%;
            animation: spinReverse 1.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .clock-hand-hour {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 36px;
            margin-left: -2px;
            background: #f8fafc;
            border-radius: 999px;
            transform-origin: 50% 100%;
            animation: spinReverseSlow 1.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin: -6px 0 0 -6px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;
        }
        .rewind-year {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #fbbf24;
            font-variant-numeric: tabular-nums;
        }
        .rewind-label {
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        @keyframes spinReverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(-720deg); }
        }
        @keyframes spinReverseSlow {
            from { transform: rotate(90deg); }
            to { transform: rotate(-270deg); }
        }

        #scene-backdrop {
            position: fixed;
            inset: 0;
            background-color: #090f1d;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px 24px 190px 24px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            z-index: 5;
        }
        #scene-backdrop.active {
            display: flex;
            opacity: 1;
            pointer-events: auto;
        }
        #scene-backdrop::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(2, 6, 23, 0.25) 0%, rgba(2, 6, 23, 0.88) 100%);
            pointer-events: none;
            z-index: 1;
        }

            max-height: calc(100vh - 250px);

            height: auto;

            border-radius: 14px;
            border: 1px solid rgba(251, 191, 36, 0.35);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);

            z-index: 2;
            display: none;
            max-width: 540px;
            text-align: center;
            background: rgba(15, 23, 42, 0.95);
            border: 1px dashed rgba(251, 191, 36, 0.5);
            border-radius: 14px;
            padding: 24px;
            color: #fde68a;

            left: 50%;
            transform: translateX(-50%);

            align-items: center;

        .photo-caption-bar button {

            font-size: 0.8rem;
            border-radius: 7px;

        .ui-overlay {

            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);

            max-width: 650px;
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 16px;
            padding: 18px 20px;
            box-sizing: border-box;
            z-index: 10;

        .detail-popup-header {

            margin-bottom: 6px;

        .detail-close-btn {

</head>

        // --- UTRZYMANIE WŁĄCZONEGO EKRANU NA TELEFONIE (SCREEN WAKE LOCK) ---
        let wakeLockSentinel = null;

        async function requestWakeLock() {
            if (!('wakeLock' in navigator)) return;
            if (document.visibilityState !== 'visible') return;
            if (wakeLockSentinel && !wakeLockSentinel.released) return;

            try {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockSentinel.addEventListener('release', () => {
                    wakeLockSentinel = null;
                });
            } catch (err) {
                console.debug('Wake Lock niedostępny:', err);
            }
        }

        requestWakeLock();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        window.addEventListener('pointerdown', () => {
            requestWakeLock();
        }, { once: false });

                tick.style.transform = `translateX(-50%) rotate(${i * 30}deg)`;

            clearInterval(rewindTimer);

        function playTimeRewindOnce() {
            if (rewindPlayed) return;
            rewindPlayed = true;

            const years = ['1945', '1944', '1943', '1942', '1941', '1940', '1939'];
            const yearEl = document.getElementById('rewind-year');
            let idx = 0;
            yearEl.innerText = years[0];

            rewindTimer = setInterval(() => {
                idx++;
                if (idx < years.length) {
                    yearEl.innerText = years[idx];
                } else {
                    clearInterval(rewindTimer);
                    setTimeout(hideTimeRewind, 350);
                }
            }, 210);

                detailParagraphs: [

                btnLabel: 'Rozwiń dokładniejszy opis podsumowania',

                desc: 'Tragiczny rozdział dziejów pogranicza polsko-ukraińskiego podczas II wojny światowej — masowa zbrodnia na polskiej ludności cywilnej wymagająca pamięci i rzetelnej wiedzy historycznej.',
                detailParagraphs: [
                    'Tragiczny rozdział dziejów pogranicza polsko-ukraińskiego podczas II wojny światowej — masowa zbrodnia na polskiej ludności cywilnej wymagająca pamięci i rzetelnej wiedzy historycznej.'
                ],
                detailPoints: [
                    'Masowa czystka etniczna na ludności polskiej w 1943 r.',
                    'Ważny element pamięci historycznej i edukacji.'

                loc: POLAND_LOCATIONS.wolyn,

        let countriesData = [];
        let currentStep = 0;
        let currentPhotoIndex = 0;
        let activeDetailKey = null; // np. 'photo-0', 'photo-1', 'slide'
        const maxSteps = SLIDES.length - 1;

        const urlParams = new URLSearchParams(window.location.search);
        const isPresenter = urlParams.get('pilot') === SECRET_PIN;

        if (isPresenter) {
            document.getElementById('presenter-controls').style.display = 'flex';
            document.getElementById('status-badge').innerText = '👑 TRYB PILOTA AKTYWNY';
            document.getElementById('status-badge').style.color = '#fbbf24';
        } else {
            document.getElementById('status-badge').innerText = '🟢 POŁĄCZONO NA ŻYWO';
            document.getElementById('status-badge').style.color = '#4ade80';
        }

        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .pointOfView({ lat: 52.0, lng: 19.5, altitude: 0.52 });

        world.controls().autoRotate = false;

        fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson')
            .then(res => res.json())
            .then(data => {
                countriesData = data.features;
                highlightPoland();
            });

        function highlightPoland() {
            const poland = countriesData.filter(d => d.properties.ADM0_A3 === 'POL');
            if (!poland.length) return;
            world
                .polygonsData(poland)
                .polygonCapColor(() => 'rgba(251, 191, 36, 0.25)')
                .polygonSideColor(() => 'rgba(251, 191, 36, 0.6)')
                .polygonStrokeColor(() => '#fbbf24')
                .polygonAltitude(0.02);
        }

        function closeDetailWindow() {
            activeDetailKey = null;
            const slide = SLIDES[currentStep] || SLIDES[0];
            renderSlideDescription(slide);
        }

        function buildFormattedDetailHtml(sourceObj, fallbackText) {
            let html = '';
            if (Array.isArray(sourceObj.detailParagraphs) && sourceObj.detailParagraphs.length > 0) {
                html += sourceObj.detailParagraphs.map(t => `<p>${t}</p>`).join('');
            } else {
                html += `<p>${sourceObj.details || fallbackText || ''}</p>`;
            }

            if (Array.isArray(sourceObj.detailPoints) && sourceObj.detailPoints.length > 0) {
                html += `<ul class="detail-points">${sourceObj.detailPoints.map(pt => `<li>${pt}</li>`).join('')}</ul>`;
            }
            return html;
        }

        function renderSlideDescription(slide) {
            const staticDescEl = document.getElementById('slide-desc');
            const interactiveWrap = document.getElementById('slide-interactive-desc');
            const buttonsWrap = document.getElementById('desc-buttons-wrap');
            const popupWindow = document.getElementById('detail-popup-window');
            const popupTitle = document.getElementById('detail-popup-title');
            const popupBody = document.getElementById('detail-popup-body');

            // Pierwszy slajd: zostaje zwykły opis
            if (slide.keepStaticDesc) {
                staticDescEl.style.display = 'block';
                staticDescEl.innerText = slide.desc;
                interactiveWrap.style.display = 'none';
                popupWindow.classList.remove('open');
                return;
            }

            // Pozostałe slajdy: zamiast zwykłego opisu pokazujemy guziki i wysuwane okienko
            staticDescEl.style.display = 'none';
            interactiveWrap.style.display = 'block';
            buttonsWrap.innerHTML = '';

            const hasPhotos = Array.isArray(slide.photos) && slide.photos.length > 0;

            if (hasPhotos) {
                const isSinglePhoto = slide.photos.length === 1;

                slide.photos.forEach((photo, idx) => {
                    const key = `photo-${idx}`;
                    const isActive = activeDetailKey === key;

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'info-trigger-btn' + (isSinglePhoto ? ' single' : '') + (isActive ? ' active' : '');

                    const labelText = photo.btnLabel || (isSinglePhoto ? 'Dokładniejszy opis' : `Zdjęcie ${idx + 1}: ${photo.caption}`);
                    const indicator = isActive ? '▲' : '▼';
                    btn.innerHTML = `<span>${labelText}</span><span>${indicator}</span>`;

                    btn.onclick = () => {
                        if (activeDetailKey === key) {
                            activeDetailKey = null;
                        } else {
                            activeDetailKey = key;
                            if (!isSinglePhoto && idx !== currentPhotoIndex) {
                                applyPhoto(slide, idx, false);
                            }
                        }
                        renderSlideDescription(slide);
                    };

                    buttonsWrap.appendChild(btn);
                });
            } else {
                const key = 'slide-summary';
                const isActive = activeDetailKey === key;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'info-trigger-btn single' + (isActive ? ' active' : '');
                const labelText = slide.btnLabel || 'Rozwiń dokładniejszy opis';
                const indicator = isActive ? '▲' : '▼';
                btn.innerHTML = `<span>${labelText}</span><span>${indicator}</span>`;

                btn.onclick = () => {
                    activeDetailKey = isActive ? null : key;
                    renderSlideDescription(slide);
                };

                buttonsWrap.appendChild(btn);
            }

            // Wypełnienie i otwarcie/zamknięcie wysuwanego okienka
            if (activeDetailKey) {
                if (activeDetailKey.startsWith('photo-') && hasPhotos) {
                    const idx = parseInt(activeDetailKey.replace('photo-', ''), 10);
                    const photo = slide.photos[idx] || slide.photos[currentPhotoIndex] || slide.photos[0];
                    popupTitle.innerText = photo.detailTitle || photo.caption || slide.title;
                    popupBody.innerHTML = buildFormattedDetailHtml(photo, slide.desc);
                } else {
                    popupTitle.innerText = slide.detailTitle || slide.title;
                    popupBody.innerHTML = buildFormattedDetailHtml(slide, slide.desc);
                }
                popupWindow.classList.add('open');
            } else {
                popupWindow.classList.remove('open');
            }
        }

        function applyPhoto(slide, photoIdx, syncDetailToPhoto = true) {
            const backdrop = document.getElementById('scene-backdrop');
            const photoBar = document.getElementById('photo-bar');
            const captionEl = document.getElementById('photo-caption-text');
            const prevBtn = document.getElementById('prev-photo-btn');
            const nextBtn = document.getElementById('next-photo-btn');
            const imgEl = document.getElementById('slide-image');
            const fallbackEl = document.getElementById('image-fallback');
            const fallbackCaption = document.getElementById('fallback-caption');
            const fallbackUrl = document.getElementById('fallback-url');

            if (!slide.photos || slide.photos.length === 0) {
                backdrop.classList.remove('active');
                photoBar.classList.remove('visible');
                imgEl.removeAttribute('src');
                return;
            }

            const safeIdx = ((photoIdx % slide.photos.length) + slide.photos.length) % slide.photos.length;
            currentPhotoIndex = safeIdx;
            const photo = slide.photos[safeIdx];

            if (syncDetailToPhoto && activeDetailKey && activeDetailKey.startsWith('photo-')) {
                activeDetailKey = `photo-${safeIdx}`;
            }
            renderSlideDescription(slide);

            backdrop.classList.add('active');
            captionEl.innerText = slide.photos.length > 1
                ? `${photo.caption} (${safeIdx + 1}/${slide.photos.length})`
                : photo.caption;

            prevBtn.style.display = slide.photos.length > 1 ? 'inline-block' : 'none';
            nextBtn.style.display = slide.photos.length > 1 ? 'inline-block' : 'none';
            photoBar.classList.add('visible');

            if (!photo.url) {
                imgEl.style.display = 'none';
                fallbackEl.style.display = 'block';
                fallbackCaption.innerText = photo.caption;
                fallbackUrl.innerText = 'Brak przypisanego linku (url) dla tego zdjęcia w tablicy SLIDES.';
                return;
            }

            imgEl.style.display = 'block';
            fallbackEl.style.display = 'none';
            imgEl.alt = photo.caption;

            imgEl.onload = () => {
                imgEl.style.display = 'block';
                fallbackEl.style.display = 'none';
            };
            imgEl.onerror = () => {
                imgEl.style.display = 'none';
                fallbackEl.style.display = 'block';
                fallbackCaption.innerText = photo.caption;
                fallbackUrl.innerText = photo.url;
            };
            imgEl.src = photo.url;
        }

        function cyclePhoto(delta) {
            const slide = SLIDES[currentStep];
            if (!slide || !slide.photos || slide.photos.length <= 1) return;
            applyPhoto(slide, currentPhotoIndex + delta, true);
        }

        function renderScene(step) {
            if (step === 0) {
                playTimeRewindOnce();
            } else {
                hideTimeRewind();
            }

            const slide = SLIDES[step] || SLIDES[0];
            currentPhotoIndex = 0;
            activeDetailKey = null;

            document.getElementById('section-badge').innerText = slide.tag;
            document.getElementById('step-counter').innerText = `${step + 1} / ${SLIDES.length}`;
            document.getElementById('slide-title').innerText = slide.title;

            renderSlideDescription(slide);
            highlightPoland();

            world.htmlElementsData([{
                lat: slide.loc.lat,
                lng: slide.loc.lng,
                label: slide.loc.label
            }]).htmlElement(d => {
                const el = document.createElement('div');
                el.innerHTML = `<div class="poland-pin">📍 ${d.label}</div>`;
                return el;
            });

            document.getElementById('scene-backdrop').classList.remove('active');
            document.getElementById('photo-bar').classList.remove('visible');

            world.pointOfView({
                lat: slide.loc.lat,
                lng: slide.loc.lng,
                altitude: slide.loc.altitude
            }, 1000);

            if (slide.photos && slide.photos.length > 0) {
                setTimeout(() => {
                    applyPhoto(slide, 0, false);
                }, 650);
            }
        }

        renderScene(0);

        // --- POBIERANIE STANU Z BAZY CO 1 SEKUNDĘ (ZMIENNA: history_step) ---
        async function checkServerStep() {
            const { data, error } = await supabaseClient
                .from('presentation_state')
                .select(HISTORY_COLUMN)
                .eq('id', 'main')
                .single();

            const remoteStep = data?.[HISTORY_COLUMN];
            if (!error && typeof remoteStep === 'number') {
                if (remoteStep !== currentStep) {
                    currentStep = remoteStep;
                    renderScene(currentStep);
                }
            }
        }

        setInterval(checkServerStep, 1000);
        checkServerStep();

        // --- ZAPIS NOWEGO KROKU DO BAZY (DLA PILOTA) ---
        async function changeStep(delta) {
            if (!isPresenter) return;
            hideTimeRewind();

            let next = currentStep + delta;
            if (next < 0) next = 0;
            if (next > maxSteps) next = maxSteps;

            const { error } = await supabaseClient
                .from('presentation_state')
                .update({ [HISTORY_COLUMN]: next })
                .eq('id', 'main');

            if (!error) {
                currentStep = next;
                renderScene(currentStep);
            } else {
                console.error('Błąd zapisu:', error);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!isPresenter) return;
            if (e.key === 'ArrowRight') changeStep(1);
            if (e.key === 'ArrowLeft') changeStep(-1);
        });
    </script>
