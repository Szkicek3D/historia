        #time-rewind-overlay {

        .clock-dial {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid rgba(251, 191, 36, 0.7);
            box-shadow: 0 0 35px rgba(251, 191, 36, 0.2), inset 0 0 25px rgba(2, 6, 23, 0.9);
            background: rgba(15, 23, 42, 0.9);
        }
        .clock-tick {
            position: absolute;
            top: 6px;
            left: 50%;
            width: 2px;
            height: 10px;
            background: rgba(251, 191, 36, 0.45);
            transform-origin: 50% 69px;
        }
        .clock-hand-minute {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 3px;
            height: 54px;
            margin-left: -1.5px;
            background: #fbbf24;
            border-radius: 999px;
            transform-origin: 50% 100%;
            animation: spinReverse 1.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .clock-hand-hour {
            position: absolute;
            bottom: 50%;
            left: 50%;
            width: 4px;
            height: 36px;
            margin-left: -2px;
            background: #f8fafc;
            border-radius: 999px;
            transform-origin: 50% 100%;
            animation: spinReverseSlow 1.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin: -6px 0 0 -6px;
            border-radius: 50%;
            background: #fbbf24;
            box-shadow: 0 0 10px #fbbf24;

            from { transform: rotate(0deg); }
            to { transform: rotate(-720deg); }
        }
        @keyframes spinReverseSlow {
            from { transform: rotate(90deg); }
            to { transform: rotate(-270deg); }

        // --- UTRZYMANIE WŁĄCZONEGO EKRANU NA TELEFONIE (SCREEN WAKE LOCK) ---
let wakeLockSentinel = null;

async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    if (document.visibilityState !== 'visible') return;
    if (wakeLockSentinel && !wakeLockSentinel.released) return;

    try {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
        });
    } catch (err) {
        // Np. słaba bateria lub tryb oszczędzania energii — ignorujemy bez błędu
        console.debug('Wake Lock niedostępny:', err);
    }
}

// Próba włączenia od razu po załadowaniu strony
requestWakeLock();

// Ponowne włączenie po powrocie do karty na telefonie
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        requestWakeLock();
    }
});

// Dodatkowy bezpiecznik po pierwszym kliknięciu / dotknięciu ekranu
window.addEventListener('pointerdown', () => {
    requestWakeLock();
}, { once: false });

                idx++;

                .polygonSideColor(() => 'rgba(251, 191, 36, 0.6)')
                .polygonStrokeColor(() => '#fbbf24')
                .polygonAltitude(0.02);
        }

        function applyPhoto(slide, photoIdx) {
            const backdrop = document.getElementById('scene-backdrop');
            const photoBar = document.getElementById('photo-bar');
            const captionEl = document.getElementById('photo-caption-text');
            const prevBtn = document.getElementById('prev-photo-btn');
            const nextBtn = document.getElementById('next-photo-btn');
            const imgEl = document.getElementById('slide-image');
            const fallbackEl = document.getElementById('image-fallback');
            const fallbackCaption = document.getElementById('fallback-caption');
            const fallbackUrl = document.getElementById('fallback-url');

            if (!slide.photos || slide.photos.length === 0) {
                backdrop.classList.remove('active');
                photoBar.classList.remove('visible');
                imgEl.removeAttribute('src');
                return;
            }

            const safeIdx = ((photoIdx % slide.photos.length) + slide.photos.length) % slide.photos.length;
            currentPhotoIndex = safeIdx;
            const photo = slide.photos[safeIdx];

            backdrop.classList.add('active');
            captionEl.innerText = slide.photos.length > 1
                ? `${photo.caption} (${safeIdx + 1}/${slide.photos.length})`
                : photo.caption;

            prevBtn.style.display = slide.photos.length > 1 ? 'inline-block' : 'none';
            nextBtn.style.display = slide.photos.length > 1 ? 'inline-block' : 'none';
            photoBar.classList.add('visible');

            if (!photo.url) {
                imgEl.style.display = 'none';
                fallbackEl.style.display = 'block';
                fallbackCaption.innerText = photo.caption;
                fallbackUrl.innerText = 'Brak przypisanego linku (url) dla tego zdjęcia w tablicy SLIDES.';
                return;
            }

            imgEl.style.display = 'block';
            fallbackEl.style.display = 'none';
            imgEl.alt = photo.caption;

            imgEl.onload = () => {
                imgEl.style.display = 'block';
                fallbackEl.style.display = 'none';
            };
            imgEl.onerror = () => {
                imgEl.style.display = 'none';
                fallbackEl.style.display = 'block';
                fallbackCaption.innerText = photo.caption;
                fallbackUrl.innerText = photo.url;
            };
            imgEl.src = photo.url;
        }

        function cyclePhoto(delta) {
            const slide = SLIDES[currentStep];
            if (!slide || !slide.photos || slide.photos.length <= 1) return;
            applyPhoto(slide, currentPhotoIndex + delta);
        }

        function renderScene(step) {
            if (step === 0) {
                playTimeRewindOnce();
            } else {
                hideTimeRewind();
            }

            const slide = SLIDES[step] || SLIDES[0];
            currentPhotoIndex = 0;

            document.getElementById('section-badge').innerText = slide.tag;
            document.getElementById('step-counter').innerText = `${step + 1} / ${SLIDES.length}`;
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-desc').innerText = slide.desc;

            highlightPoland();

            world.htmlElementsData([{
                lat: slide.loc.lat,
                lng: slide.loc.lng,
                label: slide.loc.label
            }]).htmlElement(d => {
                const el = document.createElement('div');
                el.innerHTML = `<div class="poland-pin">📍 ${d.label}</div>`;
                return el;
            });

            document.getElementById('scene-backdrop').classList.remove('active');
            document.getElementById('photo-bar').classList.remove('visible');

            world.pointOfView({
                lat: slide.loc.lat,
                lng: slide.loc.lng,
                altitude: slide.loc.altitude
            }, 1000);

            if (slide.photos && slide.photos.length > 0) {
                setTimeout(() => {
                    applyPhoto(slide, 0);
                }, 650);
            }
        }

        renderScene(0);

        // --- POBIERANIE STANU Z BAZY CO 1 SEKUNDĘ (ZMIENNA: history_step) ---
        async function checkServerStep() {
            const { data, error } = await supabaseClient
                .from('presentation_state')
                .select(HISTORY_COLUMN)
                .eq('id', 'main')
                .single();

            const remoteStep = data?.[HISTORY_COLUMN];
            if (!error && typeof remoteStep === 'number') {
                if (remoteStep !== currentStep) {
                    currentStep = remoteStep;
                    renderScene(currentStep);
                }
            }
        }

        setInterval(checkServerStep, 1000);
        checkServerStep();

        // --- ZAPIS NOWEGO KROKU DO BAZY (DLA PILOTA) ---
        async function changeStep(delta) {
            if (!isPresenter) return;
            hideTimeRewind();

            let next = currentStep + delta;
            if (next < 0) next = 0;
            if (next > maxSteps) next = maxSteps;

            const { error } = await supabaseClient
                .from('presentation_state')
                .update({ [HISTORY_COLUMN]: next })
                .eq('id', 'main');

            if (!error) {
                currentStep = next;
                renderScene(currentStep);
            } else {
                console.error('Błąd zapisu:', error);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!isPresenter) return;
            if (e.key === 'ArrowRight') changeStep(1);
            if (e.key === 'ArrowLeft') changeStep(-1);
        });
    </script>
</body>
</html>
